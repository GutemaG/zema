# Strict analysis for the pure-Dart data package. Rules are listed in
# memory-bank/standards/coding-standards.md; keep both in sync.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - require_trailing_commas
    - unawaited_futures
