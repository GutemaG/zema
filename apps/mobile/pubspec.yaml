name: zema
description: "Music player and synced lyrics for Ethiopian Orthodox mezmur"
publish_to: 'none'

# build-name (versionName / CFBundleShortVersionString) + build-number
# (versionCode / CFBundleVersion).
version: 1.0.0+1

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  # Version is pinned by flutter_localizations.
  intl: ^0.20.2
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

  zema_core:
    path: ../../packages/zema_core
  zema_data:
    path: ../../packages/zema_data
  permission_handler: ^12.0.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path: ^1.9.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  rxdart: ^0.28.0
  clock: ^1.1.2
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.2
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  fake_async: ^1.3.3
  google_sign_in_platform_interface: ^3.1.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  # gen-l10n: ARB files in lib/l10n/, settings in l10n.yaml.
  generate: true

  assets:
    # Font license texts, shown on the licenses page.
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-NotoSansEthiopic.txt

  # Bundled so Ethiopic renders offline and on phones without Ethiopic system
  # fonts. Never fetched at runtime. Static TTFs from Google Fonts (SIL OFL).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700

# Placeholder icon: ዜ in `primary` on `bg`. Regenerate with
# `dart run flutter_launcher_icons` from apps/mobile.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#110D0B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_foreground.png
